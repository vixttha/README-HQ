name: Technique Library
on:
  push:
    branches: [README-Technique-Library]
  pull_request:
    branches: [README-Technique-Library]
permissions:
  contents: read
jobs:
  catalog:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    name: Catalog on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Check catalog and generated pages
        run: python tools/catalog.py check
      - name: Run search, validation and scale regressions
        run: python -m unittest discover -s tests -v
