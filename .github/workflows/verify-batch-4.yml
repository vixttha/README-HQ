name: README HQ Batch 4 checkpoint evidence
on:
  push:
    branches: [audit/v0.0.6-batch-4-evidence]
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  GRAPHIFY_QUERY_LOG_DISABLE: '1'
jobs:
  checkpoint:
    name: Exact Batch 4 checkpoint qualification on ${{ matrix.os }}
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fed6ae338df9d984ce9fe767cd1f0857c89a770f
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned reader dependencies
        run: python -m pip install --require-hashes -r candidate/tools/requirements.txt
      - name: Install pinned Graphify MCP dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r candidate/graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Replay and verify every exact checkpoint
        run: python audit/batch4-public.py candidate evidence
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: batch-4-${{ matrix.os }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
  retained-plan:
    name: Retained plan workflow from a clean checkout
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fed6ae338df9d984ce9fe767cd1f0857c89a770f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install hashed README validator dependencies
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Verify the README HQ baseline
        run: python tools/check_readme_hq.py
      - name: Check published plan bytes and reject a prose-only mismatch
        shell: bash
        run: |
          statement=$(sed -n 's/^          \(git show .* | cmp .*\)$/\1/p' .github/workflows/verify-repair-plan.yml)
          test -n "$statement"
          bash -eo pipefail -c "$statement"
          plan=plans/v0.0.6-repairs/README.md
          printf '\nIntentional off-ledger mismatch.\n' >> "$plan"
          if bash -eo pipefail -c "$statement"; then
            echo 'Published plan mismatch should fail' >&2
            exit 1
          fi
          git restore -- "$plan"
      - name: Install pinned Graphify dependencies
        run: |
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Check checkpoint order and verify all three Graphify maps over MCP
        shell: bash
        run: |
          python audit/check_plan_capacity.py
          python tools/verify_plan.py --mcp
