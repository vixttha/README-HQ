name: Foundation criterion targeted review
on:
  push:
    branches: [audit/v006-foundation-criterion-review]
permissions:
  contents: read
jobs:
  controls:
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: audit-control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 0d1fbf4c2d89bad7513f89e618829152a13d53cc
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r tools/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
      - name: Run criterion negative controls
        run: python audit-control/audit/foundation_criterion_review.py candidate "${{ runner.temp }}/criterion-review.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-criterion-review
          path: ${{ runner.temp }}/criterion-review.json
          if-no-files-found: error
