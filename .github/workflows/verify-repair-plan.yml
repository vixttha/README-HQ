name: README HQ repair plan
on:
  push:
    branches: [plan/v0.0.6-repairs]
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONHASHSEED: '0'
jobs:
  validate:
    name: Verify the repair plan and Graphify evidence
    if: github.repository == 'vixttha/README-HQ' && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install hashed README validator dependencies
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Verify the README HQ baseline
        run: python tools/check_readme_hq.py
      - name: Verify the complete published repair plan
        shell: bash
        run: |
          # The published copy updates the map-count note while the archived graphs retain their original source.
          git show 562d278ad49d0b4f34c742f0c87e9c63cd8dd664:plans/v0.0.6-repairs/README.md | cmp - plans/v0.0.6-repairs/README.md
      - name: Install pinned Graphify dependencies
        run: |
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Check checkpoint order and verify all three Graphify maps over MCP
        shell: bash
        run: |
          python audit/check_plan_capacity.py
          python tools/verify_plan.py --mcp
