name: README HQ foundation acceptance controls
on:
  push:
    branches: [audit/v0.0.6-foundation-reconciliation]
permissions:
  contents: read
jobs:
  controls:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: audit-control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d12d5c6bd82fe448f64adb3ae48024296b8e6db4
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned reader dependencies
        working-directory: candidate
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Install Linux-pinned Graphify environment
        if: runner.os == 'Linux'
        working-directory: candidate
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Run targeted controls on frozen candidate
        run: python audit-control/audit/foundation_acceptance_controls.py candidate "${{ runner.temp }}/foundation-controls.json"
      - name: Retain receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-controls-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-controls.json
          if-no-files-found: error
