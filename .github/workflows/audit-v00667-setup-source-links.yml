name: README HQ v0.0.6.67 setup and source links audit
on:
  push:
    branches:
      - audit/v0.0.6.67-setup-and-source-links
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  reproduce:
    name: Reproduce newly observed defects on the exact candidate
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8d50caec2bc6fcb998994a1fd302294a029325f9
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r tools/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Verify baseline checks
        working-directory: candidate
        run: |
          python tools/check_readme_hq.py --receipt "$RUNNER_TEMP/candidate-baseline.json"
          python -m unittest discover -s tests -v
          python -m unittest discover -s graphify-hq/template/v0.0.8 -p 'test_*.py' -v
          python graphify-hq/version_maps.py --check
          python tools/verify_plan.py --mcp
      - name: Reproduce setup, source links, and validation cases
        working-directory: candidate
        run: python ../audit/audit_v00667_setup_source_links.py "$RUNNER_TEMP/candidate-audit.json"
      - name: Save exact-SHA observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-hq-v00667-setup-source-links
          path: |
            ${{ runner.temp }}/candidate-baseline.json
            ${{ runner.temp }}/candidate-audit.json
          if-no-files-found: ignore
