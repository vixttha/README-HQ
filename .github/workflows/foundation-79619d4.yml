name: Foundation criterion reconciliation
on:
  push:
    branches: [audit/v006-foundation-79619d4]
permissions:
  contents: read
jobs:
  direct:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: audit-control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 79619d43bc04ccc49097e62058fd3dc0653dd672
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install locked dependencies and run directed controls
        shell: bash
        working-directory: candidate
        run: |
          python -m pip install --require-hashes -r tools/requirements.txt
          test "$(git rev-parse HEAD)" = "79619d43bc04ccc49097e62058fd3dc0653dd672"
          python ../audit-control/audit/foundation-79619d4/direct_controls.py "$RUNNER_TEMP/foundation-controls.json"
      - name: Retain exact-candidate control receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-controls-${{ matrix.os }}-79619d43bc04ccc49097e62058fd3dc0653dd672-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/foundation-controls.json
          if-no-files-found: ignore
  routes:
    if: github.event.repository.visibility == 'public' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: audit-control
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 79619d43bc04ccc49097e62058fd3dc0653dd672
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Generate candidate reader receipt
        working-directory: candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "79619d43bc04ccc49097e62058fd3dc0653dd672"
          python -m pip install --require-hashes -r tools/requirements.txt
          python tools/check_readme_hq.py --receipt "$RUNNER_TEMP/reader.json"
      - name: Classify and observe public GitHub routes
        shell: bash
        run: python audit-control/audit/foundation-79619d4/link_review.py candidate "$RUNNER_TEMP/reader.json" "$RUNNER_TEMP/link-observations.json"
      - name: Retain route review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-routes-79619d43bc04ccc49097e62058fd3dc0653dd672-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/reader.json
            ${{ runner.temp }}/link-observations.json
          if-no-files-found: ignore
