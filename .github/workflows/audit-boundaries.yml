name: README HQ output and provenance boundaries
on:
  push:
    branches: [audit/v0.0.6-boundaries]
permissions:
  contents: read
jobs:
  reproduce:
    name: Verify boundary cases and the pristine Graphify maps on public Ubuntu
    if: github.repository == 'vixttha/README-HQ' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install the pinned Graphify environment
        run: |
          python -m pip install --require-hashes --no-cache-dir --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Run boundary fixtures and the clean control
        shell: bash
        run: python audit/audit_boundaries.py | tee -a "$GITHUB_STEP_SUMMARY"
