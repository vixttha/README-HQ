name: README HQ Batch 5 checkpoint replay
on:
  push:
    branches: [audit/v0.0.6-batch-5-evidence]
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  checkpoint:
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    name: Exact checkpoint replay on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3c349cfbe3cc5b259656783321361e91ee0d3dec
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned reader wheels
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r candidate/tools/requirements.txt
      - name: Run exact predecessor and repair controls
        run: python audit/batch5-public.py candidate evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: batch-5-${{ matrix.os }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
