name: README HQ
on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  validate:
    name: README HQ on ${{ matrix.os }}
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' &&
      (github.event_name != 'push' ||
      github.ref_name == (vars.README_HQ_PUBLICATION_BRANCH || github.event.repository.default_branch) ||
      github.ref_name == 'readme-hq' || github.ref_name == 'graphify-hq' ||
      startsWith(github.ref_name, 'repair/'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install the README validator
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Validate the pinned tree and run regressions
        run: |
          python tools/check_readme_hq.py --receipt readme-hq-result.json
          python -m unittest discover -s tests -p 'test_readme*.py' -v
      - name: Preserve the exact-SHA receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-hq-${{ matrix.os }}-${{ github.sha }}
          path: readme-hq-result.json
          if-no-files-found: ignore
  graphify:
    name: Recoverable Graphify evidence and plan
    if: >-
      github.event.repository.private == false && github.event.repository.visibility == 'public' &&
      (github.event_name != 'push' ||
      github.ref_name == (vars.README_HQ_PUBLICATION_BRANCH || github.event.repository.default_branch) ||
      github.ref_name == 'readme-hq' || github.ref_name == 'graphify-hq' ||
      startsWith(github.ref_name, 'repair/'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r tools/requirements.txt
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Verify Graphify, repair plan, and packaged self-map
        shell: bash
        run: |
          python -m unittest discover -s graphify-hq/template/v0.0.8 -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_graphify*.py' -v
          python graphify-hq/version_maps.py --check
          python tools/verify_plan.py --mcp
          kit=graphify-hq/template/v0.0.8
          python "$kit/self_map.py" "$RUNNER_TEMP/self-map.json"
          python "$kit/evidence_map.py" "$RUNNER_TEMP/self-map.json" "$RUNNER_TEMP/self-map"
      - name: Preserve Graphify receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: graphify-receipts-${{ github.sha }}
          path: |
            graphify-hq/maps/**/receipt.json
            graphify-hq/plans/**/receipt.json
            ${{ runner.temp }}/self-map/receipt.json
