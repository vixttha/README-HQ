name: README HQ
on:
  push:
    branches: [readme-hq]
  pull_request:
    branches: [main, readme-hq]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tools/check_readme_hq.py
