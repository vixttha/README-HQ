name: README HQ v0.0.6.67 deep functional audit
on:
  push:
    branches: [audit/v0.0.6.67-deep-quality]
permissions:
  contents: read
env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  audit:
    name: Deep README audit on ${{ matrix.os }}
    if: github.event.repository.private == false && github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8d50caec2bc6fcb998994a1fd302294a029325f9
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install the locked README checker
        working-directory: candidate
        run: python -m pip install --require-hashes -r tools/requirements.txt
      - name: Run the normal candidate validator
        working-directory: candidate
        run: python tools/check_readme_hq.py --receipt candidate-baseline.json
      - name: Run README regressions
        working-directory: candidate
        run: python -m unittest discover -s tests -p 'test_readme*.py' -v
      - name: Install Graphify's locked Ubuntu distribution
        if: runner.os == 'Linux'
        working-directory: candidate
        shell: bash
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r graphify-hq/template/v0.0.8/requirements.txt
          python -m pip check
      - name: Rebuild and query the original Graphify evidence
        if: runner.os == 'Linux'
        working-directory: candidate
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_graphify*.py' -v
          python -m unittest discover -s graphify-hq/template/v0.0.8 -p 'test_*.py' -v
          python graphify-hq/version_maps.py --check
          python tools/verify_plan.py --mcp
      - name: Check new observations with Graphify MCP
        if: runner.os == 'Linux'
        working-directory: candidate
        run: python ../audit/audit_v00667_deep.py candidate-observations.json --graphify
      - name: Check new observations on Windows
        if: runner.os == 'Windows'
        working-directory: candidate
        run: python ../audit/audit_v00667_deep.py candidate-observations.json
      - name: Run separate fixture checks in one default shell step
        id: shell_probe
        continue-on-error: true
        working-directory: candidate
        run: |
          python tools/check_readme_hq.py --repo . --subproject nonexistent-module --receipt shell-probe.json
          python -m unittest discover -s tests -p 'test_readme*.py' -v
      - name: Record validator and shell statuses
        if: always()
        working-directory: candidate
        env:
          SHELL_STEP_OUTCOME: ${{ steps.shell_probe.outcome }}
        run: python ../audit/audit_v00667_shell_probe.py
      - name: Save audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-hq-audit-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            candidate/candidate-baseline.json
            candidate/candidate-observations.json
            candidate/shell-observations.json
          if-no-files-found: error
